appId: com.gagan.acrobatclone
productName: Acrobat Clone
# Use a literal slug for output filenames so GitHub release uploads don't
# get silently renamed (spaces in productName become dots in the GitHub
# asset filename, which then mismatches electron-updater's latest.yml).
# The user-facing app name (Start menu shortcut, app title) still uses
# productName via shortcutName below.
artifactName: acrobat-clone-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: acrobat-clone-${version}-Setup.${ext}
  shortcutName: ${productName}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
