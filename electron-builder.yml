appId: com.gagan.acrobatclone
productName: Acrobat Clone
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-Setup.${ext}
  shortcutName: ${productName}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
